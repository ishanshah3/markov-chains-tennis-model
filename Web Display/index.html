<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Probability Engine</title>
    <style>
        
        :root {
            --court-blue: #2a5c9a;
            --court-green: #3c7d4d;
            --ball-yellow: #dfff4f;
            --white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--court-green); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .court-container { 
            width: 100%;
            max-width: 500px; 
            background-color: var(--court-blue); 
            padding: 30px; 
            border: 8px solid var(--white);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: var(--white);
        }

        h1 { 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            border-bottom: 2px solid var(--white);
            padding-bottom: 10px;
        }

        .section-label {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            margin: 20px 0 10px 0;
            font-weight: bold;
            font-size: 0.8em;
            text-transform: uppercase;
            border-left: 4px solid var(--ball-yellow);
        }

        .input-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
        }

        label { font-size: 0.95em; }

        input[type="number"] { 
            width: 70px; 
            padding: 8px; 
            border-radius: 4px; 
            border: 2px solid var(--white);
            background: var(--white);
            font-weight: bold;
            text-align: center;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--ball-yellow); 
            color: #333; 
            border: none; 
            border-radius: 4px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .output-screen { 
            margin-top: 25px; 
            background: rgba(0,0,0,0.2); 
            padding: 20px; 
            border-radius: 4px; 
            text-align: center;
            border: 1px dashed var(--ball-yellow);
        }

        .prob-value { 
            font-size: 2.5em; 
            color: var(--ball-yellow); 
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="court-container">
    <h1>Point Probabilities</h1>

    <div class="section-label">Tour Averages</div>
    <div class="input-row">
        <label>Avg Serve Win %</label>
        <input type="number" id="S" value="0.0" step="0.1">
    </div>
    <div class="input-row">
        <label>Avg Return Win %</label>
        <input type="number" id="R" value="0.0" step="0.1">
    </div>

    <div class="section-label">Player 1</div>
    <div class="input-row">
        <label>Serve Win %</label>
        <input type="number" id="P1" value="0.0" step="0.1">
    </div>
    <div class="input-row">
        <label>Return Win %</label>
        <input type="number" id="R1" value="0.0" step="0.1">
    </div>

    <div class="section-label">Player 2</div>
    <div class="input-row">
        <label>Serve Win %</label>
        <input type="number" id="P2" value="0.0" step="0.1">
    </div>
    <div class="input-row">
        <label>Return Win %</label>
        <input type="number" id="R2" value="0.0" step="0.1">
    </div>

    <button onclick="calculate()">Run Model</button>

    <div class="output-screen">
        Player 1 Win Probabilities
        <span class="prob-value" id="prob_display">--%</span>
    </div>
</div>

<script src="code.js"></script>

</body>
</html>
