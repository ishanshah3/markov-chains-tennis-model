<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Probability Engine</title>
    <style>
        
        :root {
            --court-blue: #2a5c9a;
            --court-green: #3c7d4d;
            --ball-yellow: #dfff4f;
            --white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--court-green); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .court-container { 
            width: 100%;
            max-width: 500px; 
            background-color: var(--court-blue); 
            padding: 30px; 
            border: 8px solid var(--white);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: var(--white);
        }

        h1 { 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            border-bottom: 2px solid var(--white);
            padding-bottom: 10px;
        }

        .section-label {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            margin: 20px 0 10px 0;
            font-weight: bold;
            font-size: 0.8em;
            text-transform: uppercase;
            border-left: 4px solid var(--ball-yellow);
        }

        .input-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
        }

        label { font-size: 0.95em; }

        input[type="number"] { 
            width: 70px; 
            padding: 8px; 
            border-radius: 4px; 
            border: 2px solid var(--white);
            background: var(--white);
            font-weight: bold;
            text-align: center;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--ball-yellow); 
            color: #333; 
            border: none; 
            border-radius: 4px; 
            font-size: 1.1em; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        .output-screen { 
            margin-top: 25px; 
            background: rgba(0,0,0,0.2); 
            padding: 20px; 
            border-radius: 4px; 
            border: 1px dashed var(--ball-yellow);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .output-box {
            flex: 1;
            min-width: 180px;
            background: rgba(255,255,255,0.08);
            padding: 16px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .output-label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .prob-value { 
            font-size: 2.5em; 
            color: var(--ball-yellow); 
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="court-container">
    <h1>Point Probability</h1>

    <div class="section-label">Match Setup</div>
    <div class="input-row">
        <label>Player 1 Name</label>
        <input type="text" id="player1" value="Carlos Alcaraz">
    </div>
    <div class="input-row">
        <label>Player 2 Name</label>
        <input type="text" id="player2" value="Jannik Sinner">
    </div>
    <div class="input-row">
        <label>Surface</label>
        <select id="surface">
            <option value="Clay">Clay</option>
            <option value="Hard">Hard</option>
            <option value="Grass">Grass</option>
        </select>
    </div>

    <div class="section-label">Tour Averages</div>
    <div class="input-row">
        <label>Avg Serve Win %</label>
        <input type="number" id="S" value="0.0" step="0.1">
    </div>
    <div class="input-row">
        <label>Avg Return Win %</label>
        <input type="number" id="R" value="0.0" step="0.1">
    </div>

    <div class="section-label">Player 1</div>
    <div class="input-row">
        <label>Serve Win %</label>
        <input type="number" id="S1" value="0.0" step="0.1">
    </div>
    <div class="input-row">
        <label>Return Win %</label>
        <input type="number" id="R1" value="0.0" step="0.1">
    </div>

    <div class="section-label">Player 2</div>
    <div class="input-row">
        <label>Serve Win %</label>
        <input type="number" id="S2" value="0.0" step="0.1">
    </div>
    <div class="input-row">
        <label>Return Win %</label>
        <input type="number" id="R2" value="0.0" step="0.1">
    </div>

    <button onclick="compute()">Run Model</button>

    <div class="output-screen">
        <div class="output-box">
            <div class="output-label">Player 1 — Point (serving)</div>
            <span class="prob-value" id="prob_display1">--%</span>
            <div class="output-label">Game (on serve)</div>
            <span class="prob-value" id="game_display1">--%</span>
            <div class="output-label">Set win</div>
            <span class="prob-value" id="set_display1">--%</span>
        </div>
        <div class="output-box">
            <div class="output-label">Player 2 — Point (serving)</div>
            <span class="prob-value" id="prob_display2">--%</span>
            <div class="output-label">Game (on serve)</div>
            <span class="prob-value" id="game_display2">--%</span>
            <div class="output-label">Set win</div>
            <span class="prob-value" id="set_display2">--%</span>
        </div>
    </div>
</div>

<script>
function fmt(x){ return (x*100).toFixed(2) + '%'; }

async function compute(){
    const p1 = document.getElementById('player1').value.trim();
    const p2 = document.getElementById('player2').value.trim();
    const surface = document.getElementById('surface').value;

    if(!p1 || !p2 || p1.toLowerCase() === p2.toLowerCase()){
        alert('Please enter two different player names.');
        return;
    }

    const btn = event && event.target ? event.target : null;
    if(btn) btn.disabled = true;

    try{
        const res = await fetch('/probabilities', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({player1: p1, player2: p2, surface})
        });

        if(!res.ok){
            const txt = await res.text();
            throw new Error(txt || 'Server error');
        }

        const data = await res.json();

        if(data.error){ throw new Error(data.error); }

        document.getElementById('prob_display1').textContent = fmt(data.point_win_server_p1);
        document.getElementById('prob_display2').textContent = fmt(data.point_win_server_p2);
        document.getElementById('game_display1').textContent = fmt(data.game_win_on_serve_p1);
        document.getElementById('game_display2').textContent = fmt(data.game_win_on_serve_p2);
        document.getElementById('set_display1').textContent = fmt(data.set_win_p1);
        document.getElementById('set_display2').textContent = fmt(data.set_win_p2);

    }catch(err){
        alert('Error: ' + err.message);
    }finally{
        if(btn) btn.disabled = false;
    }
}
</script>

</body>
</html>
