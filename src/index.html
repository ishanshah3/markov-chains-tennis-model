<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Probability Engine</title>
    <style>
        
        :root {
            --court-blue: #2a5c9a;
            --court-green: #3c7d4d;
            --ball-yellow: #dfff4f;
            --white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(180deg, #2e7440 0%, #244f36 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-size: 18px;
            color: var(--white);
        }

        .court-container { 
            width: 100%;
            max-width: 720px; 
            background: linear-gradient(180deg, rgba(42,92,154,0.95), rgba(36,64,120,0.95));
            padding: 28px; 
            border-radius: 12px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.02);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.06);
        }

        h1 { 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            border-bottom: 2px solid rgba(255,255,255,0.08);
            padding-bottom: 12px;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .section-label {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            margin: 20px 0 10px 0;
            font-weight: bold;
            font-size: 0.8em;
            text-transform: uppercase;
            border-left: 4px solid var(--ball-yellow);
        }

        .input-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 12px;
            margin-bottom: 12px; 
        }

        label { font-size: 1.05em; font-weight: 600; }

        input[type="number"], input[type="text"], select { 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: var(--white);
            font-weight: 600;
            text-align: left;
            min-width: 160px;
        }

        button { 
            width: 100%; 
            padding: 14px 18px; 
            background-color: var(--ball-yellow); 
            color: #1a1a1a; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.05em; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 18px;
            text-transform: uppercase;
            transition: transform 0.08s, box-shadow 0.18s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }

        button:hover { box-shadow: 0 10px 26px rgba(0,0,0,0.32); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .output-screen { 
            margin-top: 20px; 
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); 
            padding: 18px; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .output-box {
            flex: 1;
            min-width: 220px;
            background: rgba(255,255,255,0.03);
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .output-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.95;
        }

        .prob-value { 
            font-size: 2.8rem; 
            color: var(--ball-yellow); 
            display: block;
            margin-top: 6px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="court-container">
    <h1>Point Probability</h1>

    <div class="section-label">Match Setup</div>
    <div class="input-row">
        <label>Player 1 Name</label>
        <input type="text" id="player1" value="Carlos Alcaraz">
    </div>
    <div class="input-row">
        <label>Player 2 Name</label>
        <input type="text" id="player2" value="Jannik Sinner">
    </div>
    <div class="input-row">
        <label>Surface</label>
        <select id="surface">
            <option value="Clay">Clay</option>
            <option value="Hard">Hard</option>
            <option value="Grass">Grass</option>
        </select>
    </div>

    <!-- Removed numeric inputs: probabilities and percentages now computed from server-side code -->

    <button onclick="compute()">Run Model</button>

    <div class="output-screen">
        <div class="output-box">
            <div class="output-label">Player 1 — Point (serving)</div>
            <span class="prob-value" id="prob_display1">--%</span>
            <div class="output-label">Game (on serve)</div>
            <span class="prob-value" id="game_display1">--%</span>
            <div class="output-label">Set win</div>
            <span class="prob-value" id="set_display1">--%</span>
        </div>
        <div class="output-box">
            <div class="output-label">Player 2 — Point (serving)</div>
            <span class="prob-value" id="prob_display2">--%</span>
            <div class="output-label">Game (on serve)</div>
            <span class="prob-value" id="game_display2">--%</span>
            <div class="output-label">Set win</div>
            <span class="prob-value" id="set_display2">--%</span>
        </div>
    </div>
</div>

<script>
function fmt(x){ return (x*100).toFixed(2) + '%'; }

async function compute(){
    const p1 = document.getElementById('player1').value.trim();
    const p2 = document.getElementById('player2').value.trim();
    const surface = document.getElementById('surface').value;

    if(!p1 || !p2 || p1.toLowerCase() === p2.toLowerCase()){
        alert('Please enter two different player names.');
        return;
    }

    const btn = event && event.target ? event.target : null;
    if(btn) btn.disabled = true;

    try{
        const res = await fetch('/probabilities', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({player1: p1, player2: p2, surface})
        });

        if(!res.ok){
            const txt = await res.text();
            throw new Error(txt || 'Server error');
        }

        const data = await res.json();

        if(data.error){ throw new Error(data.error); }

        document.getElementById('prob_display1').textContent = fmt(data.point_win_server_p1);
        document.getElementById('prob_display2').textContent = fmt(data.point_win_server_p2);
        document.getElementById('game_display1').textContent = fmt(data.game_win_on_serve_p1);
        document.getElementById('game_display2').textContent = fmt(data.game_win_on_serve_p2);
        document.getElementById('set_display1').textContent = fmt(data.set_win_p1);
        document.getElementById('set_display2').textContent = fmt(data.set_win_p2);

    }catch(err){
        alert('Error: ' + err.message);
    }finally{
        if(btn) btn.disabled = false;
    }
}
</script>

</body>
</html>
